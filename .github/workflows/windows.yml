name: Windows
on:
  push:
    branches: [main, windows]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Third-party actions are pinned to full commit SHAs (the tag is in the comment).
jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: { persist-credentials: false }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: { python-version: "3.12" }
      - name: Install the app's packages and PyInstaller (windows/requirements.txt)
        run: python -m pip install --disable-pip-version-check -r windows/requirements.txt
      - name: Pipeline tests, on Windows
        shell: bash
        run: |
          cd pipeline
          python -X faulthandler -m pytest -q -p no:cacheprovider --junitxml=../pipeline-results.xml 2>&1 | tee ../pipeline-results.txt
          exit "${PIPESTATUS[0]}"
      - name: The Windows app's tests
        if: success() || failure()
        shell: bash
        run: |
          cd windows
          python -X faulthandler -m pytest -q -p no:cacheprovider --junitxml=../windows-results.xml 2>&1 | tee ../windows-results.txt
          exit "${PIPESTATUS[0]}"
      - name: Failing tests as annotations
        if: failure()
        run: python scripts/ci_annotate.py pipeline-results.xml windows-results.xml
      - name: onnxruntime imports cleanly next to the other packages
        if: success() || failure()
        run: python scripts/ci_import_check.py
      - name: Build NeuralLoop.exe and nl-book.exe, make the sample book with them, pack the installer
        # Inno Setup comes with GitHub's Windows images; build.py packs a zip either way. It runs even when a test
        # failed, so one run shows everything.
        if: success() || failure()
        run: python windows/build.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: NeuralLoop-windows
          path: |
            dist/NeuralLoop-*-setup.exe
            dist/NeuralLoop-*-windows.zip
          if-no-files-found: error
          retention-days: 14
