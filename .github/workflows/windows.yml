name: Windows
on:
  push:
    branches: [main, windows]
    tags: ["v*"]  # a release: the installer and its SHA-256 are attached to it (the release job below)
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Third-party actions are pinned to full commit SHAs (the tag is in the comment).
jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: { persist-credentials: false }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: { python-version: "3.12" }
      - name: Install the app's packages and PyInstaller (hash-locked, windows/requirements.txt)
        run: |
          python -m pip install --disable-pip-version-check --require-hashes -r windows/requirements.txt
          python -m pip install --disable-pip-version-check --no-deps --no-build-isolation -e ./pipeline -e ./windows
      - name: Get espeak-ng (the official installer, checked by SHA-256) for the pipeline's tests and the build
        run: python windows/build.py --espeak
      - name: Pipeline tests, on Windows
        shell: bash
        env:
          NEURALLOOP_ESPEAK: ${{ github.workspace }}\build\windows\espeak-ng\espeak-ng.exe
        run: |
          cd pipeline
          python -X faulthandler -m pytest -q -p no:cacheprovider --junitxml=../pipeline-results.xml 2>&1 | tee ../pipeline-results.txt
          exit "${PIPESTATUS[0]}"
      - name: The Windows app's tests
        if: success() || failure()
        shell: bash
        run: |
          cd windows
          python -X faulthandler -m pytest -q -p no:cacheprovider --junitxml=../windows-results.xml 2>&1 | tee ../windows-results.txt
          exit "${PIPESTATUS[0]}"
      - name: Failing tests as annotations
        if: failure()
        run: python scripts/ci_annotate.py pipeline-results.xml windows-results.xml
      - name: Build NeuralLoop.exe and nl-book.exe, make the sample book with them, pack the installer
        # Inno Setup comes with GitHub's Windows images; build.py packs a zip either way. It runs even when a test
        # failed, so one run shows everything.
        if: success() || failure()
        run: python windows/build.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: NeuralLoop-windows
          path: |
            dist/NeuralLoop-*-Setup.exe
            dist/NeuralLoop-*-windows.zip
          if-no-files-found: error
          retention-days: 14

  # On a version tag (vX.Y.Z), after the build and its checks pass: NeuralLoop-X.Y.Z-Setup.exe and its SHA-256
  # go on that tag's GitHub release (made as a draft when it doesn't exist yet, for the Mac's DMG to join).
  # Only this job can write to the repository, and it runs nothing from the build but the files it uploads.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: windows
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with: { name: NeuralLoop-windows, path: dist }
      - name: The installer matches the tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          setup="dist/NeuralLoop-${TAG#v}-Setup.exe"
          if [ ! -f "$setup" ]; then
            echo "::error::No $setup: the app's version (pipeline/neuralloop_books/__init__.py) isn't ${TAG#v}."
            exit 1
          fi
          (cd dist && sha256sum "$(basename "$setup")" > "$(basename "$setup").sha256")
          cat "$setup.sha256"
      - name: Attach it to the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --draft --verify-tag --title "$TAG" --notes ""
          gh release upload "$TAG" "dist/NeuralLoop-${TAG#v}-Setup.exe" "dist/NeuralLoop-${TAG#v}-Setup.exe.sha256" --clobber
